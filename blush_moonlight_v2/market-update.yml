name: Weekly public market headlines
on:
  schedule:
    - cron: '23 15 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weekly-market-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public headlines
        run: python scripts/update_market_feed.py
      - name: Commit only changed public feed
        run: |
          git add blush_moonlight_v2/market-feed.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update public jewelry market headlines"
          git push
